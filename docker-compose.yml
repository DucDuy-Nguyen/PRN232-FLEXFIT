services:
  redis:
    image: redis:7-alpine
    container_name: flexfit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  flexfit-recommendation:
    image: flexfit-recommendation:latest
    build:
      context: .
      dockerfile: src/Services/Recommendation/FlexFit.Recommendation.Grpc/Dockerfile
    container_name: flexfit-recommendation
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  flexfit-engagement:
    image: flexfit-engagement:latest
    build:
      context: .
      dockerfile: src/Services/Engagement/Dockerfile
    container_name: flexfit-engagement
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=FlexFitDB;User ID=sa;Password=12345;TrustServerCertificate=True;MultipleActiveResultSets=True;
      - Redis__ConnectionString=redis:6379
      - GrpcSettings__RecommendationUrl=http://flexfit-recommendation:8080
      - Gemini__ApiKey=
      - Jwt__Key=VeryLongSuperSecureKey1234567890!!
      - Jwt__Issuer=FlexFitIdentity
      - Jwt__Audience=FlexFitClient
    depends_on:
      - redis
      - flexfit-recommendation

  flexfit-identity:
    image: flexfit-identity:latest
    build:
      context: .
      dockerfile: src/Services/Identity/FlexFit.Identity.API/Dockerfile
    container_name: flexfit-identity
    ports:
      - "5094:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IdentityDatabase=Server=payment-db;Database=FlexFitIdentityDb;User Id=sa;Password=YourPassword123!;Encrypt=True;TrustServerCertificate=True;
      - Redis__ConnectionString=redis:6379
      - Jwt__Key=VeryLongSuperSecureKey1234567890!!
      - Jwt__Issuer=FlexFitIdentity
      - Jwt__Audience=FlexFitClient
    depends_on:
      - payment-db
      - redis

  flexfit-gateway:
    image: flexfit-gateway:latest
    build:
      context: .
      dockerfile: src/Gateway/FlexFit.ApiGateway/Dockerfile
    container_name: flexfit-gateway
    ports:
      - "7000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=VeryLongSuperSecureKey1234567890!!
      - Jwt__Issuer=FlexFitIdentity
      - Jwt__Audience=FlexFitClient
      - ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address=http://flexfit-identity:8080/
      - ReverseProxy__Clusters__booking-cluster__Destinations__booking-api__Address=http://flexfit-booking:8080/
      - ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-api__Address=http://flexfit-catalog:5002/
      - ReverseProxy__Clusters__payment-cluster__Destinations__payment-api__Address=http://payment-api:8080/
      - ReverseProxy__Clusters__engagement-cluster__Destinations__engagement-api__Address=http://flexfit-engagement:8080/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - flexfit-identity
      - flexfit-booking
      - flexfit-catalog
      - flexfit-engagement
      - payment-api

  flexfit-booking:
    image: flexfit-booking:latest
    build:
      context: .
      dockerfile: src/Services/Booking/FlexFit.Booking.API/Dockerfile
    container_name: flexfit-booking
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=payment-db;Database=FlexFitBookingDb;User Id=sa;Password=YourPassword123!;Encrypt=True;TrustServerCertificate=True;
      - CatalogConfig__BaseUrl=http://flexfit-catalog:5002
      - CatalogConfig__UseMock=false
      - Redis__ConnectionString=redis:6379
      - Jwt__Key=VeryLongSuperSecureKey1234567890!!
      - Jwt__Issuer=FlexFitIdentity
      - Jwt__Audience=FlexFitClient
    depends_on:
      - flexfit-catalog
      - redis
      - payment-db

  flexfit-catalog:
    image: flexfit-catalog:latest
    build:
      context: .
      dockerfile: src/Services/Catalog/FlexFit.Catalog.API/Dockerfile
    container_name: flexfit-catalog
    ports:
      - "5002:5002"
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kestrel__Endpoints__Http__Url=http://+:5002
      - Kestrel__Endpoints__gRPC__Url=http://+:5003
      - ConnectionStrings__DefaultConnection=Server=payment-db;Database=FlexFitCatalogDb;User Id=sa;Password=YourPassword123!;Encrypt=True;TrustServerCertificate=True;
      - JWT_KEY=VeryLongSuperSecureKey1234567890!!
      - JWT_ISSUER=FlexFitIdentity
      - JWT_AUDIENCE=FlexFitClient
      - Jwt__Key=VeryLongSuperSecureKey1234567890!!
      - Jwt__Issuer=FlexFitIdentity
      - Jwt__Audience=FlexFitClient
    depends_on:
      - payment-db

  payment-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123!
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql

  payment-redis:
    image: redis:7.0-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  payment-api:
    build:
      context: .
      dockerfile: src/Services/Payment/FlexFit.Payment.API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=payment-db;Database=FlexFitPaymentDb;User Id=sa;Password=YourPassword123!;Encrypt=True;TrustServerCertificate=True;
      - Redis__ConnectionString=payment-redis:6379
      - Jwt__Key=VeryLongSuperSecureKey1234567890!!
      - Jwt__Issuer=FlexFitIdentity
      - Jwt__Audience=FlexFitClient
      - PayOS__ClientId=${PAYOS_CLIENT_ID:-cd7acad2-b510-4c35-80d0-8dd39cfcb555}
      - PayOS__ApiKey=${PAYOS_API_KEY:-afe2b44b-f417-4206-adf0-e6fa55e8019a}
      - PayOS__ChecksumKey=${PAYOS_CHECKSUM_KEY:-7f6d4da3a618f7f71553a4342567b3557295525fdc24b0f96b2f254d734fe6b5}
      - Payment__UseMockPayment=false
    ports:
      - "5080:8080"
    depends_on:
      - payment-db
      - payment-redis

volumes:
  sql_data:
  redis_data:
