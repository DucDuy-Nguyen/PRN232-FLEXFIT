version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: flexfit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  flexfit-recommendation:
    image: flexfit-recommendation:latest
    build:
      context: .
      dockerfile: src/Services/Recommendation/FlexFit.Recommendation.Grpc/Dockerfile
    container_name: flexfit-recommendation
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  flexfit-engagement:
    image: flexfit-engagement:latest
    build:
      context: .
      dockerfile: src/Services/Engagement/Dockerfile
    container_name: flexfit-engagement
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=FlexFitDB;User ID=sa;Password=12345;TrustServerCertificate=True;MultipleActiveResultSets=True;
      - Redis__ConnectionString=redis:6379
      - GrpcSettings__RecommendationUrl=http://flexfit-recommendation:8080
      - Gemini__ApiKey=
    depends_on:
      - redis
      - flexfit-recommendation

  flexfit-gateway:
    image: flexfit-gateway:latest
    build:
      context: .
      dockerfile: src/Gateways/FlexFit.ApiGateway/Dockerfile
    container_name: flexfit-gateway
    ports:
      - "7000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__engagement__Destinations__destination1__Address=http://flexfit-engagement:8080/
      - ReverseProxy__Clusters__monolith__Destinations__destination1__Address=http://host.docker.internal:5100/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - flexfit-engagement

volumes:
  redis_data:
